# /etc/apache2/sites-available/app.conf
# Host virtual de la aplicación LogiRed en servidor2:
#   - sirve el frontend (archivos estáticos de /var/www/app)
#   - actúa como API Gateway (proxy inverso): /api/<recurso> -> microservicio
# Requiere: sudo a2enmod proxy proxy_http
<VirtualHost *:80>
    ServerName app.logired.com
    DocumentRoot /var/www/app
    # página que abre al entrar a http://app.logired.com (index.html es el inicio de sesión)
    DirectoryIndex index.html

    # API Gateway: cada ruta pública se reenvía al microservicio que escucha en 127.0.0.1
    ProxyPass        /api/usuarios http://127.0.0.1:3001/usuarios
    ProxyPassReverse /api/usuarios http://127.0.0.1:3001/usuarios
    ProxyPass        /api/clientes http://127.0.0.1:3002/clientes
    ProxyPassReverse /api/clientes http://127.0.0.1:3002/clientes
    ProxyPass        /api/envios   http://127.0.0.1:3003/envios
    ProxyPassReverse /api/envios   http://127.0.0.1:3003/envios

    ErrorLog ${APACHE_LOG_DIR}/app_error.log
    CustomLog ${APACHE_LOG_DIR}/app_access.log combined
</VirtualHost>
